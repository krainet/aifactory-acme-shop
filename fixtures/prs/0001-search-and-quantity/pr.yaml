number: 7
title: "feat: product search and cart quantity update"
body: |
  Adds two small features requested by the storefront team:

  - `GET /products/search?q=<term>` searches the catalog by product name.
  - `PUT /cart/{cart_id}/items/{product_id}` sets the quantity of a cart line directly, so the
    cart page no longer needs a remove + add round trip.

  Tests added for both endpoints; all tests pass locally.
